name: Publier SAFYLIFE (site de test)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code proposé
        uses: actions/checkout@v4
        with:
          ref: '2665616a983da8ce6f3e3ac051e8ede299c15345'
          persist-credentials: false
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Vérifier les archives et empreintes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,zipfile,pathlib
          base=pathlib.Path('releases-dev')
          index=json.loads((base/'SAFYLIFE_v0_12_CHECKSUMS.json').read_text())
          for name in ['SAFYLIFE_v0_12_SOURCE_DEV.zip','SAFYLIFE_v0_12_PWA_DEV.zip']:
              info=index['files'][name]
              content=(base/name).read_bytes()
              assert len(content)==info['bytes'], f'{name}: incorrect size'
              assert hashlib.sha256(content).hexdigest()==info['sha256'], f'{name}: incorrect sha256'
              with zipfile.ZipFile(base/name) as z:
                  assert z.testzip() is None
          print('Both source and PWA archive checksums verified')
          PY
      - name: Extraire le projet source existant
        shell: bash
        run: mkdir -p _source && unzip -q releases-dev/SAFYLIFE_v0_12_SOURCE_DEV.zip -d _source
      - name: Appliquer le correctif RC1 vérifié
        working-directory: _source
        shell: bash
        run: |
          gzip -dc ../releases-dev/SAFYLIFE_RC1.patch.gz | patch -p1 --batch --forward
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-emergency-sources.mjs')
          s=p.read_text()
          old="'police-mobile', 'police-landline'].includes"
          assert s.count(old)==1, "Unexpected audit schema"
          p.write_text(s.replace(old, "'police-mobile', 'police-landline', 'fire'].includes"))
          PY
      - name: Appliquer l'extension des sept pays documentés
        working-directory: _source
        run: python3 ../releases-dev/extend-rc1-72.py
      - name: Intégrer le lot consolidé trilingue
        working-directory: _source
        shell: bash
        run: |
          python3 - <<'PY'
          import tarfile, json, hashlib
          from pathlib import Path
          archive=Path('../releases-dev/SAFYLIFE_LOT_TRILINGUE.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='44657060d64add04e6ec2bc7c9a759292ad2bae0ce373d199497e5a80f6b1294'
          expected={'src/app/fr-secours.ts','src/app/fr-terrain.ts','src/app/fr-world.ts','src/app/guide.ts','src/app/home-i18n.ts','src/app/sos-international.ts','tests/guide-i18n.test.ts','tests/world.test.ts','scripts/audit-international-review.mjs','scripts/test-guide-i18n-dom.py'}
          with tarfile.open(archive,'r:gz') as t:
              assert {m.name for m in t.getmembers()}==expected|{'SHA256.json'}
              assert all(m.isfile() for m in t.getmembers())
              manifest=json.load(t.extractfile('SHA256.json'))
              assert set(manifest)==expected
              for name in sorted(expected):
                  data=t.extractfile(name).read()
                  assert hashlib.sha256(data).hexdigest()==manifest[name]
                  Path(name).write_bytes(data)
          PY
      - name: Intégrer le référentiel des 237 destinations
        working-directory: _source
        shell: bash
        run: |
          echo 'b2e9f618938ef58b416f1e0f49de2ab471d434acb48cd3133b8f395b7da3c66d  ../releases-dev/SAFYLIFE_237.patch.gz' | sha256sum -c -
          gzip -dc ../releases-dev/SAFYLIFE_237.patch.gz | patch -p1 --batch --forward
      - name: Intégrer la localisation des modules et les recettes de validation
        working-directory: _source
        shell: bash
        run: |
          echo 'fe55376c64c422392dd14163d9c02e5e1131e096c0e59b3c85bcb84335a6cdfd  ../releases-dev/SAFYLIFE_TRILINGUE.patch.gz' | sha256sum -c -
          gzip -dc ../releases-dev/SAFYLIFE_TRILINGUE.patch.gz | patch -p1 --batch --forward
      - name: Intégrer les six langues SOS supplémentaires
        working-directory: _source
        shell: bash
        run: |
          echo 'cf83e94fa1527842755a232db64ac0ebf84d838c5db41debd66b9759be7ab9d5  ../releases-dev/SAFYLIFE_9_LANGUES.patch.gz' | sha256sum -c -
          gzip -dc ../releases-dev/SAFYLIFE_9_LANGUES.patch.gz | patch -p1 --batch --forward
      - name: Intégrer les traductions globales
        working-directory: _source
        shell: bash
        run: |
          echo 'de16b23cdd565b42f71d48c2c459618fa3ead283e729de27bc556289cf4561a0  ../releases-dev/SAFYLIFE_GLOBAL_LOCALE.patch.gz' | sha256sum -c -
          gzip -dc ../releases-dev/SAFYLIFE_GLOBAL_LOCALE.patch.gz | patch -p1 --batch --forward
      - name: Intégrer les trois derniers modules traduits
        working-directory: _source
        shell: bash
        run: |
          echo '968855ee82e8eb987d4e26978ed2321c0ddc27df1ee1984d316fc3fc6c024030  ../releases-dev/SAFYLIFE_FINAL_LOCALES.patch.gz' | sha256sum -c -
          gzip -dc ../releases-dev/SAFYLIFE_FINAL_LOCALES.patch.gz | patch -p1 --batch --forward
      - name: Corriger le débordement RTL du lien d'accessibilité
        working-directory: _source
        run: python3 ../releases-dev/fix-rtl-viewport.py
      - name: Réparer le renouvellement du cache PWA
        working-directory: _source
        run: python3 ../releases-dev/repair-pwa-upgrade.py
      - name: Installer les dépendances du projet
        working-directory: _source
        run: npm ci --no-audit --no-fund
      - name: Exécuter tous les tests QA et le contrôle des pays
        working-directory: _source
        shell: bash
        run: |
          npm run qa
          node scripts/audit-emergency-sources.mjs
      - name: Vérifier les six nouvelles interfaces SOS
        working-directory: _source
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check playwright
          .venv/bin/python -m playwright install --with-deps chromium
          export CHROME=$(.venv/bin/python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          .venv/bin/python scripts/test-extra-sos-dom.py
          .venv/bin/python scripts/test-extra-preparedness-dom.py
          .venv/bin/python scripts/test-extra-final-dom.py
      - name: Préparer la PWA vérifiée
        run: |
          set -euo pipefail
          cp -a _source/public _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/sw.js
          test -s _site/manifest.webmanifest
          test -s _site/icons/icon-192.png
          python3 -c 'import json; m=json.load(open("_site/manifest.webmanifest")); assert m["scope"]=="./" and m["start_url"]=="./"'
          python3 - <<'PY'
          import json,os,pathlib
          build=os.environ['GITHUB_SHA'][:7]
          p=pathlib.Path('_site/index.html')
          s=p.read_text()
          assert s.count('<span>SAFYLIFE</span>')==1
          p.write_text(s.replace('<span>SAFYLIFE</span>','<span>SAFYLIFE<small style="display:block;font-size:.65rem;color:#526b68">v. '+build+'</small></span>'))
          pathlib.Path('_site/build-info.json').write_text(json.dumps({'build':build,'source_commit':'2665616a983da8ce6f3e3ac051e8ede299c15345','destinations':237,'main_languages':['fr','en','es'],'additional_sos_languages':['pt','de','it','ar','zh','hi'],'additional_localized_modules':['home','household','missions','guides','simulations','checklist','print','data','tester','games','adventures','map','advanced_sos','first_aid'],'status':'test'}))
          assert ('const BUILD = "'+build+'"') in pathlib.Path('_site/sw.js').read_text()
          PY
      - name: Tester la mise à jour depuis une ancienne installation
        run: _source/.venv/bin/python releases-dev/test-pwa-upgrade.py _site SAFYLIFE_PWA.zip
      - name: Audit mobile complet avant publication
        shell: bash
        run: |
          set -euo pipefail
          _source/.venv/bin/python -m playwright install --with-deps webkit
          python3 -m http.server 18798 --bind 127.0.0.1 --directory _site >/tmp/safylife-candidate.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18798/build-info.json >/dev/null; then break; fi
            sleep 1
          done
          export SAFYLIFE_AUDIT_BASE=http://127.0.0.1:18798/
          export SAFYLIFE_AUDIT_BUILD=${GITHUB_SHA:0:7}
          _source/.venv/bin/python releases-dev/audit-mobile-viewport.py chromium "Pixel 7"
          _source/.venv/bin/python releases-dev/audit-mobile-viewport.py webkit "iPhone 13"
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Vérifier la disponibilité de l'archive Pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.name=="github-pages" and .expired==false) | .id' >/tmp/pages-artifact-id && test -s /tmp/pages-artifact-id; then
              echo "Archive Pages disponible: $(cat /tmp/pages-artifact-id)"
              exit 0
            fi
            sleep 5
          done
          echo "Archive Pages absente de l'API après transfert" >&2
          exit 1
      - name: Publier le site
        id: deploiement
        uses: actions/deploy-pages@v4
      - name: Vérifier la version réellement servie par GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://tommyiboudghacene-sys.github.io/safylife-test'
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 15 "$base/build-info.json?check=${GITHUB_SHA}-$attempt" -o /tmp/safylife-live.json && python3 -c 'import os,json; assert json.load(open("/tmp/safylife-live.json"))["build"]==os.environ["GITHUB_SHA"][:7]'; then
              curl -fsS --max-time 15 "$base/index.html?check=${GITHUB_SHA}" -o /tmp/safylife-index.html
              grep -F "v. ${GITHUB_SHA:0:7}" /tmp/safylife-index.html
              curl -fsS --max-time 15 "$base/mise-a-jour.html?check=${GITHUB_SHA}" | grep -F "mise-a-jour.js"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Audit mobile de la version réellement publiée
        shell: bash
        run: |
          set -euo pipefail
          export SAFYLIFE_AUDIT_BUILD=${GITHUB_SHA:0:7}
          _source/.venv/bin/python releases-dev/audit-mobile-viewport.py chromium "Pixel 7"
          _source/.venv/bin/python releases-dev/audit-mobile-viewport.py webkit "iPhone 13"
